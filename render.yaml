databases:
  - name: ticketing-db
    plan: free
    databaseName: ticketing
    user: ticketing

services:
  - type: web
    name: ticketing-backend
    runtime: node
    plan: free
    rootDir: backend
    # `prisma migrate deploy` applies committed migrations without generating new ones or
    # prompting — the correct command for a production database (see prisma/migrations/).
    buildCommand: npm install && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ticketing-db
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 4000
      # Set once the Vercel frontend URL is known — see README's Deployment section.
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: HOLD_TTL_MINUTES
        value: 10
      - key: WAITLIST_OFFER_TTL_MINUTES
        value: 30
      - key: EXPIRY_SWEEP_INTERVAL_SECONDS
        value: 15
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
